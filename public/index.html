<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messenger</title>
<style>
  :root {
    --bg: #f3f5f7; --panel: #ffffff; --ink: #14202b; --muted: #6a7885;
    --line: #dde3e8; --me: #0f6b5c; --me-ink: #ffffff; --other: #e9eef2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1418; --panel: #151d23; --ink: #e6edf2; --muted: #8a99a6;
      --line: #25313a; --me: #1f9a84; --me-ink: #04201a; --other: #1f2a32;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 720px; height: 100%; display: flex; flex-direction: column; background: var(--panel); border-inline: 1px solid var(--line); }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 1.05rem; margin: 0; flex: 1; }
  .status { font-size: .85rem; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #c0392b; margin-right: 6px; }
  .dot.on { background: #2ecc71; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; background: var(--other); overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; background: var(--me); color: var(--me-ink); }
  .meta { display: block; font-size: .75rem; opacity: .7; margin-bottom: 2px; }
  .empty { color: var(--muted); text-align: center; margin: auto; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  input, textarea, button { font: inherit; color: inherit; }
  textarea { flex: 1; resize: none; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); max-height: 120px; }
  button { padding: 10px 18px; border: 0; border-radius: 12px; background: var(--me); color: var(--me-ink); cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }
  #join { margin: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; width: min(360px, 100%); }
  #join h2 { margin: 0 0 4px; }
  #join input { padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
  #join label { font-size: .85rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">Messenger</h1>
    <span class="status"><span id="dot" class="dot"></span><span id="status">Nicht verbunden</span></span>
  </header>

  <form id="join">
    <h2>Chat beitreten</h2>
    <label>Dein Name <input id="name" maxlength="24" required autocomplete="nickname"></label>
    <label>Raum <input id="room" maxlength="32" value="lobby" required></label>
    <button type="submit">Beitreten</button>
  </form>

  <div id="log" class="hidden" aria-live="polite"></div>
  <form id="send" class="hidden">
    <textarea id="text" rows="1" placeholder="Nachricht schreiben" maxlength="2000" required></textarea>
    <button type="submit" id="sendBtn" disabled>Senden</button>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
let ws, name, room, retry = 0, seen = new Set();

$("name").value = localStorage.getItem("name") || "";
const hashRoom = location.hash.slice(1);
if (hashRoom) $("room").value = hashRoom;

$("join").addEventListener("submit", (e) => {
  e.preventDefault();
  name = $("name").value.trim();
  room = $("room").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "") || "lobby";
  localStorage.setItem("name", name);
  location.hash = room;
  $("join").classList.add("hidden");
  $("log").classList.remove("hidden");
  $("send").classList.remove("hidden");
  $("title").textContent = "# " + room;
  connect();
  $("text").focus();
});

function setStatus(on, text) {
  $("dot").classList.toggle("on", on);
  $("status").textContent = text;
  $("sendBtn").disabled = !on;
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?room=${encodeURIComponent(room)}`);
  ws.onopen = () => { retry = 0; setStatus(true, "Verbunden"); };
  ws.onclose = () => {
    setStatus(false, "Verbindung getrennt, neuer Versuch …");
    setTimeout(connect, Math.min(1000 * 2 ** retry++, 15000));
  };
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.type === "history") { $("log").innerHTML = ""; seen.clear(); d.messages.forEach(add); if (!d.messages.length) empty(); }
    else if (d.type === "msg") { document.querySelector(".empty")?.remove(); add(d); }
    else if (d.type === "count") $("status").textContent = `Verbunden · ${d.count} online`;
  };
}

function empty() {
  const p = document.createElement("p");
  p.className = "empty"; p.textContent = "Noch keine Nachrichten. Schreib die erste.";
  $("log").append(p);
}

function add(m) {
  if (seen.has(m.id)) return;
  seen.add(m.id);
  const el = document.createElement("div");
  el.className = "msg" + (m.name === name ? " me" : "");
  const meta = document.createElement("span");
  meta.className = "meta";
  meta.textContent = `${m.name} · ${new Date(m.ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}`;
  const body = document.createElement("span");
  body.textContent = m.text;
  el.append(meta, body);
  const log = $("log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.append(el);
  if (atBottom || m.name === name) log.scrollTop = log.scrollHeight;
}

$("send").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: "msg", name, text }));
  $("text").value = "";
});

$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").requestSubmit(); }
});
</script>
</body>
</html>
